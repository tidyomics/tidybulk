name: rworkflows
'on':
  push:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
  pull_request:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        - os: ubuntu-latest
          bioc: devel
          r: auto
          cont: ghcr.io/bioconductor/bioconductor_docker:devel
          rspm: ~
        - os: macOS-latest
          bioc: release
          r: auto
          cont: ~
          rspm: ~
        - os: windows-latest
          bioc: release
          r: auto
          cont: ~
          rspm: ~
    steps:
    # On R devel, rworkflows installs CRAN remotes and then upgrades it from
    # GitHub in the same process. Replacing a loaded package corrupts its
    # lazy-load database (R_decompress1 / libdeflate) and the job stops
    # before R CMD check. CRAN remotes can resolve and install dependencies.
    - name: Skip in-process remotes upgrade on R devel
      if: matrix.config.bioc == 'devel'
      shell: bash
      run: |
        mkdir -p "$HOME/bin"
        cat > "$HOME/bin/Rscript" << 'EOF'
        #!/bin/bash
        real=/usr/local/bin/Rscript
        if [ -n "${1:-}" ] && [ -f "$1" ] && grep -q 'remotes::install_github("r-lib/remotes")' "$1"; then
          sed -i 's|remotes::install_github("r-lib/remotes")|# CRAN remotes stays loaded. Upgrading it in-process breaks lazy-loading on R devel.|' "$1"
        fi
        exec "$real" "$@"
        EOF
        chmod +x "$HOME/bin/Rscript"
        echo "$HOME/bin" >> "$GITHUB_PATH"
    - uses: neurogenomics/rworkflows@master
      with:
        run_telemetry: ${{ matrix.config.os != 'ubuntu-latest' }}
        run_bioccheck: ${{ false }}
        run_rcmdcheck: ${{ true }}
        # --as-cran forces every Suggests package to be installed. Bioconductor
        # devel does not currently build sva, EGSEA, or the dependencies of
        # tidyHeatmap and pasilla, so that check cannot pass there.
        as_cran: ${{ matrix.config.bioc != 'devel' }}
        run_vignettes: ${{ true }}
        has_testthat: ${{ true }}
        run_covr: ${{ true }}
        # Fork PRs cannot push to gh-pages (GITHUB_TOKEN is read-only → 403).
        # Build/deploy docs only on push to protected branches.
        run_pkgdown: ${{ github.event_name != 'pull_request' }}
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        runner_os: ${{ runner.os }}
        cache_version: cache-v1
        docker_registry: ghcr.io
