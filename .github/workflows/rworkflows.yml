name: rworkflows
'on':
  push:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
  pull_request:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        - os: ubuntu-latest
          bioc: devel
          r: auto
          cont: ghcr.io/bioconductor/bioconductor_docker:devel
          rspm: ~
        - os: macOS-latest
          bioc: release
          r: auto
          cont: ~
          rspm: ~
        - os: windows-latest
          bioc: release
          r: auto
          cont: ~
          rspm: ~
    steps:
    # Bioconductor devel ggtree imports treelayout. That CRAN package can be
    # newer than the Posit snapshot baked into the devel Docker image, and
    # then enrichplot and clusterProfiler fail to install. The introduction
    # vignette needs both, so put treelayout on the library path first.
    - name: Install treelayout ahead of the CRAN snapshot
      if: matrix.config.bioc == 'devel'
      shell: bash
      run: |
        cat > /tmp/install-treelayout.R <<'RSCRIPT'
        lib <- .Library.site
        if (!requireNamespace("treelayout", quietly = TRUE)) {
          # dependencies = FALSE: the image already has Imports such as dplyr
          # and Rcpp. Installing them again from current CRAN overwrites the
          # Docker library and corrupts later package installs.
          install.packages(
            "treelayout",
            lib = lib,
            repos = "https://cloud.r-project.org",
            dependencies = FALSE
          )
        }
        if (!requireNamespace("treelayout", quietly = TRUE)) {
          stop("treelayout failed to install; ggtree, enrichplot, and clusterProfiler need it on Bioconductor devel")
        }
        RSCRIPT
        sudo Rscript /tmp/install-treelayout.R
    - uses: neurogenomics/rworkflows@master
      with:
        run_telemetry: ${{ matrix.config.os != 'ubuntu-latest' }}
        run_bioccheck: ${{ false }}
        run_rcmdcheck: ${{ true }}
        as_cran: ${{ true }}
        run_vignettes: ${{ true }}
        has_testthat: ${{ true }}
        run_covr: ${{ true }}
        # Fork PRs cannot push to gh-pages (GITHUB_TOKEN is read-only → 403).
        # Build/deploy docs only on push to protected branches.
        run_pkgdown: ${{ github.event_name != 'pull_request' }}
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        runner_os: ${{ runner.os }}
        cache_version: cache-v1
        docker_registry: ghcr.io
